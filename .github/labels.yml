# Taxonomía de etiquetas del repo. Fuente de verdad.
# Se sincroniza con GitHub vía .github/workflows/labels-sync.yml
# (push a main que toque este archivo, o ejecución manual desde Actions).

- name: "type/bug"
  color: "d73a4a"
  description: "Algo no funciona como debería"
- name: "type/feature"
  color: "0e8a16"
  description: "Funcionalidad nueva que hoy no existe"
- name: "type/enhancement"
  color: "a2eeef"
  description: "Mejora de algo que ya existe"
- name: "type/docs"
  color: "0075ca"
  description: "README, CLAUDE.md o comentarios en el código"

- name: "area/gameplay"
  color: "5319e7"
  description: "Piezas, rotación, colisiones, wall kicks, line clear"
- name: "area/rendering"
  color: "6f42c1"
  description: "Dibujo en canvas: grid, ghost, next, alpha"
- name: "area/input"
  color: "8250df"
  description: "Teclado, controles y pausa"
- name: "area/scoring"
  color: "b392f0"
  description: "Puntaje, líneas, nivel y velocidad de caída"
- name: "area/ui"
  color: "1f6feb"
  description: "index.html, style.css, HUD y overlay"
- name: "area/infra"
  color: "586069"
  description: "Workflows, tooling y configuración del repo"

- name: "priority/high"
  color: "b60205"
  description: "Rompe el juego o bloquea el uso normal"
- name: "priority/medium"
  color: "fbca04"
  description: "Impacto moderado, existe workaround"
- name: "priority/low"
  color: "c2e0c6"
  description: "Cosmético o nice to have"

- name: "needs-info"
  color: "d876e3"
  description: "Falta información para reproducir o decidir"
- name: "duplicate"
  color: "cfd3d7"
  description: "Ya existe otro issue equivalente"
- name: "triaged"
  color: "0052cc"
  description: "Analizado automáticamente por Claude"
- name: "no-triage"
  color: "ededed"
  description: "Excluir este issue del análisis automático"
